<h1><button type="button" id="brand" aria-label="constructor. press to see the spectrum">constructor</button></h1>

<script>
(function () {
  /* ---- the brand beats once, a second after arrival. After that only by hand: a tap is one beat, a hold
          keeps the word lit at the peak of the spectrum until it is let go. While a beat runs, presses do nothing. ---- */
  var btn = document.getElementById("brand"), down = 0, busy = false,
      still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!btn) return;
  function beat() {                       /* one beat at a time: nothing lands while one is running */
    if (busy || still) return;            /* (with reduced motion there is no animation to end, so no beat) */
    busy = true; btn.classList.remove("lit"); btn.classList.add("beat");
  }
  btn.addEventListener("animationend", function () { btn.classList.remove("beat"); busy = false; });
  btn.addEventListener("pointerdown", function (e) {
    if (e.button || busy) return;
    down = Date.now(); btn.classList.add("lit");
  });
  function release() {
    if (!down) return;
    var held = Date.now() - down > 250; down = 0;
    if (held) btn.classList.remove("lit"); else beat();
  }
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("pointerleave", function () { if (down) { down = 0; btn.classList.remove("lit"); } });
  btn.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); beat(); } });
  setTimeout(beat, 1000);
})();
</script>
